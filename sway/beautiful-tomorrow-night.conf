# Beautiful Tomorrow Night for Sway -- palette/night.toml.
#
# Window decorations: the focused title bar is the selection surface
# (#373b41) with foreground text and a comment-grey border. With
# `default_border pixel 2` that border is the focus cue on tiled windows;
# unfocused windows recede to the bar background (#1d1f21). Blue is reserved
# for the selected workspace in Waybar. Urgent windows get a constant-red
# title bar.
#
# Night only, matching the Waybar theme: Sway has no system light/dark signal
# of its own. Window border and title-bar colours are all palette roles:
#
#   border       comment / selection / background / constant
#   background   selection / background / constant
#   text         foreground / comment / background
#   indicator    comment / selection / background
#   child_border selection / background / constant

client.focused           #969896 #373b41 #c5c8c6 #969896 #373b41
client.focused_inactive  #373b41 #1d1f21 #969896 #373b41 #1d1f21
client.focused_tab_title #373b41 #1d1f21 #c5c8c6
client.unfocused         #1d1f21 #1d1f21 #969896 #1d1f21 #1d1f21
client.urgent            #cc6666 #cc6666 #1d1f21 #1d1f21 #cc6666
